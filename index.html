<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 워드클라우드 (플로팅 효과)</title>
    
    <!-- 외부 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Firebase SDK 로드 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            padding: 20px;
        }
        .controls {
            margin: 20px auto;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 60%;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #a71d2a; }
        
        #canvas-container {
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 10px;
            width: 800px;
            height: 500px;
            max-width: 100%;
            overflow: hidden; /* 영역 밖으로 나가는 글자 숨김 */
        }

        /* 캔버스 대신 사용하는 div 영역 */
        #wordCanvas {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 🌟 글자들이 떠다니는 애니메이션 정의 🌟 */
        @keyframes floatUpDown {
            0%, 100% { margin-top: 0px; }
            50% { margin-top: -12px; } /* 위로 12px 이동 */
        }

        /* 기본 떠다니는 효과 클래스 */
        .float-word {
            animation-name: floatUpDown;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            cursor: default;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1); /* 약간의 그림자로 입체감 부여 */
        }

        /* 단어마다 움직임이 겹치지 않게 속도와 시작 시간을 다르게 설정 */
        .delay-1 { animation-duration: 3.0s; animation-delay: 0.0s; }
        .delay-2 { animation-duration: 3.5s; animation-delay: -1.0s; }
        .delay-3 { animation-duration: 4.2s; animation-delay: -2.0s; }
        .delay-4 { animation-duration: 2.8s; animation-delay: -0.5s; }
        .delay-5 { animation-duration: 4.5s; animation-delay: -1.5s; }
        
        /* 모바일 화면 설정 */
        @media (max-width: 768px) {
            #canvas-container, #qr-btn, #reset-btn { display: none; }
            input[type="text"] { width: 100%; margin-bottom: 10px; }
        }
        
        #qr-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            display: none;
        }
        #qrcode { margin-top: 15px; }
    </style>
</head>
<body>

    <h1>✨ 실시간 우리 반 워드클라우드</h1>
    
    <div class="controls">
        <input type="text" id="wordInput" placeholder="생각나는 단어를 입력하세요" onkeypress="handleKeyPress(event)">
        <button onclick="addWord()">입력</button>
        <button id="qr-btn" onclick="toggleQR()">QR 코드 보기</button>
        <button id="reset-btn" class="btn-danger" onclick="resetCloud()">화면 초기화(교사용)</button>
    </div>

    <div id="qr-container">
        <h3>스마트폰으로 접속하세요!</h3>
        <div id="qrcode"></div>
    </div>

    <div id="canvas-container">
        <!-- 기존 canvas 태그를 삭제하고 div 태그로 변경했습니다 -->
        <div id="wordCanvas"></div>
    </div>

    <script>
        // ==========================================
        // 1. 여기에 선생님의 Firebase 설정을 붙여넣으세요.
        // ==========================================
        const firebaseConfig = {
           apiKey: "AIzaSyAEavIFLbwD0LVsHZwBWEawFGFSiv7Uxvk",
           authDomain: "wordcloud-6a4e9.firebaseapp.com",
           databaseURL: "https://wordcloud-6a4e9-default-rtdb.firebaseio.com",
           projectId: "wordcloud-6a4e9",
           storageBucket: "wordcloud-6a4e9.firebasestorage.app",
           messagingSenderId: "90249332490",
           appId: "1:90249332490:web:9eb74f831898ac12de1cf3",
           measurementId: "G-LCHPNBVW0W"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let wordCounts = {};

        db.ref('words').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                wordCounts = data;
            } else {
                wordCounts = {}; 
            }
            drawWordCloud(); 
        });

        function addWord() {
            const inputElement = document.getElementById('wordInput');
            let word = inputElement.value.trim();

            if (word === "") {
                alert("단어를 입력해주세요.");
                return;
            }

            word = word.replace(/[.#$\[\]]/g, '');

            const wordRef = db.ref('words/' + word);
            wordRef.transaction((currentValue) => {
                return (currentValue || 0) + 1;
            });

            inputElement.value = ""; 
            inputElement.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') addWord();
        }

        function drawWordCloud() {
            const container = document.getElementById('wordCanvas');
            container.innerHTML = ""; // 기존 HTML 요소 지우기 (초기화)

            const list = Object.keys(wordCounts).map(word => {
                return [word, 20 + (wordCounts[word] * 10)]; 
            });

            if (list.length === 0) return; 

            // Canvas 대신 div(container)를 타겟으로 지정
            WordCloud(container, {
                list: list,
                fontFamily: 'Malgun Gothic, sans-serif',
                weightFactor: 1,
                color: 'random-dark',
                backgroundColor: 'transparent',
                rotateRatio: 0, 
                // 🌟 단어마다 랜덤하게 딜레이 클래스를 부여하여 각기 다르게 떠다니도록 설정 🌟
                classes: function(word, weight, fontSize, distance, theta) {
                    const randomDelay = Math.floor(Math.random() * 5) + 1;
                    return 'float-word delay-' + randomDelay;
                }
            });
        }

        function resetCloud() {
            if (confirm("정말로 모든 단어를 지우시겠습니까?")) {
                db.ref('words').remove(); 
            }
        }

        let qrGenerated = false;
        function toggleQR() {
            const qrContainer = document.getElementById('qr-container');
            if (qrContainer.style.display === "flex") {
                qrContainer.style.display = "none";
            } else {
                qrContainer.style.display = "flex";
                if (!qrGenerated) {
                    const currentUrl = window.location.href;
                    new QRCode(document.getElementById("qrcode"), {
                        text: currentUrl,
                        width: 150,
                        height: 150
                    });
                    qrGenerated = true;
                }
            }
        }
    </script>
</body>
</html>
